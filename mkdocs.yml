site_name: TypeSafeAI .NET Documentation
site_description: Documentation for the tryAGI .NET SDK for TypeSafeAI.
site_url: https://tryAGI.github.io/TypeSafeAI/
repo_url: https://github.com/tryAGI/TypeSafeAI
repo_name: tryAGI/TypeSafeAI
edit_uri: edit/main/docs/
nav:
- Overview: index.md
- Feature parity: feature-parity.md
- Guides:
  - Microsoft.Extensions.AI: guides/meai.md
# EXAMPLES:START
- Examples:
  - Generate: examples/generate.md
  - Mixed questions: examples/mixed-questions.md
  - Structured state: examples/structured-state.md
  - Custom response projection: examples/custom-response.md
  - List models: examples/list-models.md
  - Bounded batch: examples/bounded-batch.md
  - Replay and forward compatibility: examples/replay.md
  - Typed intent routing: examples/intent-routing.md
  - AI functions and evaluation: examples/meai-functions-evaluation.md
  - Guardrail policy: examples/guardrail-policy.md
  - Typed API errors: examples/api-errors.md
  - Protected headers: examples/protected-headers.md
# EXAMPLES:END
        
theme:
  name: tryagi
  favicon: 'media/icon128.png'

plugins:
  - search
  - copy-to-llm

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - toc:
      permalink: ""
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower, percent_encode: true}}
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.highlight:
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.progressbar
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: math
          class: arithmatex
          format: !!python/object/apply:pymdownx.arithmatex.arithmatex_fenced_format {kwds: {mode: mathjax}}
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.tabbed:
      alternate_style: true
